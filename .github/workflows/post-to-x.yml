name: Post To X

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Postせず本文だけ確認する"
        required: false
        default: false
        type: boolean
      post_text:
        description: "任意の投稿本文。空ならテンプレートを使用"
        required: false
        type: string

jobs:
  post:
    runs-on:
      - self-hosted
      - windows
      - seetona-x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade playwright

      - name: Post to X
        shell: powershell
        env:
          X_POST_TEMPLATE: ${{ secrets.X_POST_TEMPLATE }}
          SEETONA_URL: ${{ secrets.SEETONA_URL }}
          PLAYWRIGHT_CHANNEL: ${{ secrets.PLAYWRIGHT_CHANNEL }}
          X_BROWSER_PROFILE_DIR: F:\game\local\x-playwright-profile
          INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          INPUT_POST_TEXT: ${{ github.event_name == 'workflow_dispatch' && inputs.post_text || '' }}
        run: |
          $args = @('post')
          if (-not [string]::IsNullOrWhiteSpace($env:X_BROWSER_PROFILE_DIR)) {
            $args += '--profile-dir'
            $args += $env:X_BROWSER_PROFILE_DIR
          }
          if ($env:INPUT_DRY_RUN -eq 'true') {
            $args += '--dry-run'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_POST_TEXT)) {
            $args += '--text'
            $args += $env:INPUT_POST_TEXT
          }
          python scripts/post_to_x_browser.py @args
